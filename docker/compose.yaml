# Имя проекта задано явно: без него Compose назвал бы проект по каталогу с этим
# файлом, и образ с контейнером получили бы имена вида docker-tests — по папке,
# а не по приложению.
name: reminder

services:
  tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app
    environment:
      REMINDER_DB: /tmp/reminders.db
    volumes:
      - ../src:/app/src:ro
      - ../tests:/app/tests:ro
    command: ["pytest"]
