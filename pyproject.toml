[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reminder"
version = "0.1.0"
description = "Напоминалка для macOS: SQLite, tkinter, системные уведомления"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
reminder = "reminder.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reminder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
